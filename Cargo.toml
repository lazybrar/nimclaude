[package]
name = "nimclaude"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Use NVIDIA NIM chat-completions models in Claude Code via a local Anthropic-compatible proxy"
license = "GPL-2.0-or-later"
repository = "https://github.com/lazybrar/nimclaude"
readme = "README.md"

[dependencies]
axum = "0.8"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
